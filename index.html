<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<title>Home</title>

	<link rel="stylesheet" href="styles.css">
	<script src="api.js"></script>
	<script src="navigation.js"></script>
	
<style>



.container{
	padding:20px
}

.page-title{
	text-align:center;
	font-size:1.8rem;
	font-weight:700;
	margin-bottom:20px
}

.card{
	background:linear-gradient(180deg,#161B22,#111827);
	border:1px solid var(--border);
	border-radius:18px;
	padding:18px;
	margin-bottom:18px
}

.workout-card{
	text-align:center;
	border-color:#B22222
}

.workout-name{
	font-size:2rem;
	font-weight:700
}

.exercise-count,
.best-streak,
.next-time{
	color:var(--muted)
}

.btn-primary{
	width:100%;
	background:#B22222;
	color:#fff;
	border:none;
	border-radius:12px;
	padding:14px;
	font-weight:700;
	margin-top:16px;
	cursor:pointer
}

.streak-value,
.volume-number{
	font-size:2rem;
	font-weight:700
}



</style>
</head>

<body>

<div class="container">

	<h1 class="page-title">
		Workout 5.0
	</h1>

		<div class="card workout-card">

		<div id="workoutName" class="workout-name">
			Loading...
		</div>

		<div id="exerciseCount" class="exercise-count">
			Loading...
		</div>

		<button class="btn-primary" onclick="location.href='workout.html'">START WORKOUT</button>
		</div>

		<div class="card">
			<div>Current Streak</div><div id="streak" class="streak-value">🔥 0 Days</div>
			<div class="best-streak">Based on workout history</div>
		</div>

	<div class="card">

		<div>Next Workout</div>

		<div
			id="nextWorkout"
			style="font-size:1.2rem;font-weight:700;margin-top:8px">
			Loading...
		</div>

		<div class="next-time">
			Up Next
		</div>

	</div>

	<div class="card">

		<div>Monthly Volume</div>

		<div id="monthVolume" class="volume-number">
			0 lbs
		</div>

		<div id="monthCount">
			0 Exercises Logged
		</div>

	</div>

</div>

	<div id="navigation"></div>

<script>

async function init(){

	const w=
		await (
			await fetch(API+'?action=getCurrentWorkout')
		).json();

	workoutName.innerText=w.PlanName;

	exerciseCount.innerText=
		w.ExerciseCount+' Exercises';

	const plans=
		await (
			await fetch(API+'?action=getWorkoutPlans')
		).json();

	const next=
		plans.find(
			p=>Number(p.PlanID)===Number(w.PlanID)+1
		) || plans[0];

	nextWorkout.innerText=next.PlanName;

	const hist=
		await (
			await fetch(API+'?action=getWorkoutHistory')
		).json();

	let vol=0;

	hist.forEach(x=>{
		vol+=Number(x.Volume||0);
	});

	monthVolume.innerText=
		vol.toLocaleString()+' lbs';

	monthCount.innerText=
		hist.length+' Exercises Logged';

	const dates=[
		...new Set(
			hist
				.map(x=>String(x.WorkoutDate).substring(0,10))
				.filter(Boolean)
		)
	];

	streak.innerText=
		'🔥 '+
		dates.length+
		' Day'+
		(dates.length===1?'':'s');
}

	document.getElementById('navigation').innerHTML = buildNavigation('home');

init();
</script>
</body>
</html>
