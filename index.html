<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Home</title>
	<link rel="stylesheet" href="styles.css?v=1">
	<link rel="stylesheet" href="cards.css?v=1">
	<link rel="stylesheet" href="ticker-slide.css?v=3">
	<link rel="stylesheet" href="battleLines.css?v=2">
	<script src="api.js"></script>
	<script src="navigation.js"></script>

</head>
<body>
	<h1 class="page-title">Dashboard</h1>
	<div class="card workout-card">
		<div id="workoutName" class="workout-name">Loading...</div>
		<div id="exerciseCount" class="exercise-count">Loading...</div>
		<button class="btn-primary" onclick="location.href=buildProfileUrl('workout.html')">START WORKOUT</button>
	</div>

<div class="card ticker-card ticker-slide-card">

	<div class="ticker-title">
		📡 Workout Wire
	</div>

	<div class="ticker-window ticker-slide-window">

		<div
			id="tickerSlideHeadline"
			class="ticker-slide-headline">
		</div>

		<div class="ticker-slide-detail-wrap">

			<div
				id="tickerSlideDetail"
				class="ticker-slide-detail">
			</div>

		</div>

	</div>

</div>

<div class="card battle-lines-card">

	<div class="card-header">
		<div class="card-title">
			⚔️ Battle Lines
		</div>
	</div>

	<div class="battle-lines-header">
		<span>IRONWOLF</span>
		<span>TITAN</span>
	</div>

	<div
		id="battleLinesList"
		class="battle-lines-list">
		Loading...
	</div>

</div>

<div class="card lead-chase-card">

	<div class="card-header">
		<div class="card-title">
			🎯 Lead Chase
		</div>
	</div>

	<div
		id="leadChaseList"
		class="lead-chase-list">

		Loading...

	</div>

</div>

	<div class="card">

		<div class="card-header">
			<div class="card-title">
				Current Streak
			</div>
		</div>
		<div class="kpi">

			<div id="streak" class="kpi-value">
				🔥 0 Days
			</div>
			<div class="kpi-label">
				Based on workout history
			</div>
		</div>
	</div>
	<div class="card">

		<div class="card-header">
			<div class="card-title">
				Next Workout
			</div>
		</div>
		<div class="kpi">
			<div
				id="nextWorkout"
				class="kpi-value">
				Loading...
			</div>

			<div class="kpi-label">
				Up Next
			</div>

		</div>

	</div>

	<div class="card">

		<div class="card-header">
			<div class="card-title">
				Monthly Volume
			</div>
		</div>

		<div class="kpi">

			<div
				id="monthVolume"
				class="kpi-value">
				0 lbs
			</div>

			<div
				id="monthCount"
				class="kpi-label">
				0 Exercises Logged
			</div>

		</div>

	</div>
	<div class="card">

		<div class="card-header">
			<div class="card-title">
				Recent Activity
			</div>
		</div>

		<div id="recentActivity" class="card-list"></div>
	</div>

	<div class="card">

		<div class="card-header">
			<div class="card-title">
				Top Muscle Groups by Volume
			</div>
		</div>

		<div id="topMuscleGroups"></div>

	</div>

<div id='quickModal' class='modal'>
	<div class='content'>
		<h3>Quick Entry</h3>

		<select id='area' onchange='loadQuickExercises()'>
			<option>Abs</option>
			<option>Back</option>
			<option>Biceps</option>
			<option>Body</option>
			<option>Cardio</option>
			<option>Chest</option>
			<option>Legs</option>
			<option>Shoulders</option>
			<option>Stretching</option>
			<option>Triceps</option>
		</select>

		<select id='quickExercise'
			onchange='quickExerciseChanged()'>
		</select>

		<div id='quickFields'></div>

		<button class='btn save'
			onclick='saveQuickEntry()'>
			Save
		</button>

		<button class='btn cancel'
			onclick='quickModal.style.display="none"'>
			Cancel
		</button>
	</div>
</div>

<div id="navigation"></div>
<script src="profile.js"></script>
<script src="home.js?v=4"></script>
<script src="cache.js"></script>
<script src="quickEntry.js?v=1"></script>
<script src="familyTicker.js?v=15"></script>

</body>
</html>
