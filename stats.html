<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<title>Stats</title>

	<link rel="stylesheet" href="styles.css?v=1">
	<link rel="stylesheet" href="cards.css?v=1">
	<link rel="stylesheet" href="pages.css?v=1">
	<script src="api.js"></script>
	<script src="navigation.js"></script>

</head>

<body>

	<h1 class="page-title">Stats</h1>

<div class="filters">
  <button id="d" class="btn active" onclick="setPeriod('daily')">
    Daily
  </button>

  <button id="m" class="btn" onclick="setPeriod('monthly')">
    Monthly
  </button>

  <button id="y" class="btn" onclick="setPeriod('yearly')">
    Yearly
  </button>
</div>

<div class="card">
	<div class="stat-label">Total Volume</div>
	<div id="tv" class="stat-value">0 lbs</div>
</div>

<div class="card">
	<div class="stat-label">Exercises Logged</div>
	<div id="ec" class="stat-value">0</div>
</div>

<div class="card">
	<div class="stat-label">Workout Days</div>
	<div id="wd" class="stat-value">0</div>
</div>

<div class="card">
	<div class="stat-label">Average Volume</div>
	<div id="av" class="stat-value">0 lbs</div>
</div>

<div class="card">
	<div class="stat-label">Top Exercise</div>
	<div id="te" class="stat-small">None</div>
</div>
	<div id="navigation"></div>

<script>


let all = [];

async function init() {
  all = await (
    await fetch(API + '?action=getWorkoutHistory')
  ).json();

  render('daily');
}

function setPeriod(p) {
  d.classList.remove('active');
  m.classList.remove('active');
  y.classList.remove('active');

  if (p === 'daily') {
    d.classList.add('active');
  }

  if (p === 'monthly') {
    m.classList.add('active');
  }

  if (p === 'yearly') {
    y.classList.add('active');
  }

  render(p);
}

function render(period) {

  let data = [...all];
  let now = new Date();

  data = data.filter(x => {

    let dt = new Date(
      x.WorkoutDate || x.Timestamp
    );

	if (period === 'daily') {

		const today =
			new Date().toLocaleDateString('sv-SE');

		return String(x.WorkoutDate).substring(0,10) ===
			today;
	}
    if (period === 'monthly') {
      return (
        dt.getMonth() === now.getMonth() &&
        dt.getFullYear() === now.getFullYear()
      );
    }

    return dt.getFullYear() === now.getFullYear();
  });

  let vol = 0;
  let max = 0;
  let top = 'None';

  data.forEach(x => {

    let v = Number(x.Volume || 0);

    vol += v;

    if (v > max) {
      max = v;
      top = x.ExerciseName || 'Unknown';
    }
  });

  let days = new Set(
    data.map(x =>
      String(x.WorkoutDate).substring(0, 10)
    )
  ).size;

  tv.innerText =
    vol.toLocaleString() + ' lbs';

  ec.innerText =
    data.length;

  wd.innerText =
    days;

  av.innerText =
    (
      data.length
        ? Math.round(vol / data.length)
        : 0
    ).toLocaleString() + ' lbs';

  te.innerText =
    top +
    ' (' +
    max.toLocaleString() +
    ' lbs)';
}

	document.getElementById('navigation').innerHTML =
		buildNavigation('stats');

init();
</script>
</body>
</html>
