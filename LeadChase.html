<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lead Chase</title>

    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="stylesheet" href="cards.css?v=2">
    <link rel="stylesheet" href="battleLines.css?v=3">
    <link rel="stylesheet" href="leadchase.css?v=1">

    <script src="api.js"></script>
    <script src="navigation.js"></script>

</head>

<body>

    <h1 class="page-title">
        🎯 Lead Chase
    </h1>

    <div class="card">

        <div class="card-header">
            <div class="card-title">
                🎯 Lead Chase Summary
            </div>
        </div>

        <div id="leadChaseSummary">
            Loading...
        </div>

    </div>

    <div class="card">

        <div class="card-header">
            <div class="card-title">
                📋 Areas Available For Takeover
            </div>
        </div>

        <div id="leadChaseAreas">
            Loading...
        </div>

    </div>

    <div class="card">

        <div class="card-header">
            <div class="card-title">
                ✅ Currently Leading
            </div>
        </div>

        <div
            id="currentlyLeadingAreas"
            class="pill-list">
            Loading...
        </div>

    </div>

    <div id="navigation"></div>

    <script src="profile.js"></script>
    <script src="LeadChase.js?v=1"></script>

</body>

</html>
