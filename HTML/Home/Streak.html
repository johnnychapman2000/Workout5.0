<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Streak Details</title>

    <link rel="stylesheet" href="styles.css?v=1">
    <script src="api.js"></script>
    <script src="navigation.js"></script>
</head>

<body>

<h1 class="page-title">🔥 Streak Details</h1>

<div class="card">
    <div class="card-title">Current Streak</div>
    <div id="currentStreak" class="kpi-value">Loading...</div>
    <div id="personalBest" class="kpi-label"></div>
</div>

<div class="card">
    <div class="card-title">Next Milestone</div>
    <div id="nextMilestone" class="kpi-value">Loading...</div>
    <div id="daysRemaining" class="kpi-label"></div>
</div>

<div class="card">
    <div class="card-title">Monthly Consistency</div>
    <div id="monthlyConsistency"></div>
</div>

<div class="card">
    <div class="card-title">Streak History</div>
    <div id="streakHistory"></div>
</div>

<div class="card">
    <div class="card-title">Milestones</div>
    <div id="milestones"></div>
</div>

<div class="card">
    <div class="card-title">Streak Motivation</div>
    <div id="streakMotivation"></div>
</div>

<div id="navigation"></div>

<script src="profile.js"></script>
Streak.js?v=1script>

</body>
</html>
