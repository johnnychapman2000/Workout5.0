<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">

	<title>History</title>

	<link rel="stylesheet" href="styles.css?v=1">
	<link rel="stylesheet" href="cards.css?v=1">
	<link rel="stylesheet" href="pages.css?v=1">
	<script src="api.js"></script>
	<script src="navigation.js"></script>

</head>

<body>

<h1 class="page-title">
	History
</h1>

<div class="tabs">

	<button
		id="r"
		class="btn active"
		onclick="loadRecent()">
		⚡ Recent
	</button>

	<button
		id="d"
		class="btn"
		onclick="loadDaily()">
		📅 Daily
	</button>

	<button
		id="v"
		class="btn"
		onclick="loadVolume()">
		📊 Volume
	</button>

</div>

<div id="historySummary"></div>

<div id="content"></div>

<div id='quickModal' class='modal'>
	<div class='content'>
		<h3>Quick Entry</h3>

		<select id='area' onchange='loadQuickExercises()'>
			<option>Abs</option>
			<option>Back</option>
			<option>Biceps</option>
			<option>Body</option>
			<option>Cardio</option>
			<option>Chest</option>
			<option>Legs</option>
			<option>Shoulders</option>
			<option>Stretching</option>
			<option>Triceps</option>
		</select>

		<select id='quickExercise'
			onchange='quickExerciseChanged()'>
		</select>

		<div id='quickFields'></div>

		<button class='btn save'
			onclick='saveQuickEntry()'>
			Save
		</button>

		<button class='btn cancel'
			onclick='quickModal.style.display="none"'>
			Cancel
		</button>
	</div>
</div>

<div id="historyDetailModal" class="modal">

	<div class="content">

		<h3>Workout Details</h3>

		<div id="historyDetailContent"></div>

		<button
			class="btn cancel"
			id="deleteHistoryBtn">
			Delete
		</button>

		<button
			class="btn"
			onclick="closeHistoryDetail()">
			Close
		</button>

	</div>

</div>

<div id="navigation"></div>
<script src="profile.js"></script>
<script src="history.js"/script>
<script src="quickEntry.js"></script>
</body>
</html>
